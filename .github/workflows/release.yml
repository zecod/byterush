name: Release

# Pushing a tag vX.Y.Z builds every installer into a draft GitHub release, adds the browser
# extension and SHA256SUMS.txt, and publishes the release once everything is there. If any build
# fails, the draft stays unpublished. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.3.0: an existing one (its draft is reused), or a new one, created on the commit this runs from"
        required: true
        type: string

permissions:
  contents: read

# never cancel a release half-way; a second run for the same tag waits for the first
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Check versions, draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      release_id: ${{ steps.draft.outputs.result }}
      arm64_linux: ${{ steps.visibility.outputs.public }}
      matrix: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Tag format
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::\"$TAG\" is not a release tag of the form vX.Y.Z"
            exit 1
          fi

      # A pushed tag builds that tag. "Run workflow" in the Actions tab names a tag: an existing
      # one is built again (its draft release is reused); a new one is created here, on the commit
      # the workflow was run from, once that commit's files carry the version. A tag the workflow
      # creates starts no second run, so this run goes on to build it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The tag, created here when it is new
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "$TAG"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/version.mjs --check "${TAG#v}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Byterush ${TAG#v}"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $(git rev-parse --short HEAD)"
          else
            echo "::error::there is no tag $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: The tag matches the version in every file
        run: node scripts/version.mjs --check "${TAG#v}"

      # GitHub's arm64 Linux runners are free for public repositories only; in a private one a job
      # asking for them waits for a runner that never comes, so the arm64 build is skipped there.
      - name: Repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          echo "public=$([ "$private" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$private" = false ] || echo "::warning::Private repository: the Linux arm64 build is skipped (arm64 runners are free for public repositories only)."

      # The build matrix: one job per installer set. macOS is built for Apple Silicon only: Apple
      # stopped selling Intel Macs in 2023, and on a private repository every macOS minute is billed
      # ten times, so a second macOS build would double the cost of a release for few users.
      # Windows on Arm (an arm64 NSIS installer only, WiX can't make arm64 .msi packages) is not in
      # it either: it has never been built, so try it with a workflow_dispatch run on a test tag
      # first, and add its file name to the publish job's list.
      - name: Build matrix
        id: matrix
        env:
          PUBLIC: ${{ steps.visibility.outputs.public }}
        run: |
          include='[
            {"name": "Windows x64", "runner": "windows-latest", "target": "", "args": ""},
            {"name": "macOS Apple Silicon", "runner": "macos-latest", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin"},
            {"name": "Linux x64", "runner": "ubuntu-22.04", "target": "", "args": ""}
          ]'
          if [ "$PUBLIC" = true ]; then
            include=$(jq -c '. + [{"name": "Linux arm64", "runner": "ubuntu-22.04-arm", "target": "", "args": ""}]' <<<"$include")
          fi
          echo "include=$(jq -c . <<<"$include")" >> "$GITHUB_OUTPUT"
          jq . <<<"$include"

      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/release-notes.mjs "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Draft release
        id: draft
        uses: actions/github-script@v9
        env:
          NOTES: ${{ runner.temp }}/notes.md
        with:
          result-encoding: string
          script: |
            const fs = require("fs");
            const tag = process.env.TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing && !existing.draft) {
              core.setFailed(`${tag} is already published (${existing.html_url}). Release a new version instead.`);
              return "";
            }
            if (existing) {
              core.info(`Re-using draft release ${existing.id} (${existing.html_url})`);
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Byterush ${tag.slice(1)}`,
              body: fs.readFileSync(process.env.NOTES, "utf8"),
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${data.id} (${data.html_url})`);
            return String(data.id);

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # decided by the prepare job: the arm64 Linux build only while the repository is public
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The dependencies, compiled once per platform and kept while Cargo.lock and the toolchain
      # don't change; a release build then compiles only the app itself. On a private repository
      # that is most of the minutes a release costs, since macOS counts ten per minute.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.name }}

      - run: npm ci

      # Optional: with the secrets below the app is signed with a Developer ID certificate and
      # notarized. Without them it is ad-hoc signed, which Apple Silicon needs to run it at all.
      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri treats a variable that is set but empty as provided, so only the secrets that
          # exist are passed on to the build.
          pass() {
            local delim
            delim="EOF_$(openssl rand -hex 16)"
            { echo "$1<<$delim"; printenv "$1"; echo "$delim"; } >> "$GITHUB_ENV"
          }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
              echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is not"
              exit 1
            fi
            pass APPLE_CERTIFICATE
            pass APPLE_CERTIFICATE_PASSWORD
            if [ -n "$APPLE_SIGNING_IDENTITY" ]; then pass APPLE_SIGNING_IDENTITY; fi
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              pass APPLE_ID
              pass APPLE_PASSWORD
              pass APPLE_TEAM_ID
              echo "Signing with the Developer ID certificate and notarizing."
            else
              echo "::warning::Signed but not notarized: set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID to notarize."
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::No APPLE_CERTIFICATE secret: the app is ad-hoc signed and not notarized."
          fi

      # Optional: with a code signing certificate (.pfx, base64) the executables and installers are
      # signed. Without it they are unsigned.
      - name: Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::No WINDOWS_CERTIFICATE secret: the installers are not code-signed."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String "$env:WINDOWS_CERTIFICATE_PASSWORD" -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          Remove-Item $pfx
          if (-not $cert) { throw "the certificate in WINDOWS_CERTIFICATE has no private key" }
          # Tauri merges src-tauri/tauri.windows.conf.json into tauri.conf.json on Windows
          $file = "src-tauri/tauri.windows.conf.json"
          $conf = if (Test-Path $file) { Get-Content $file -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          if (-not $conf.ContainsKey("bundle")) { $conf["bundle"] = @{} }
          if (-not $conf["bundle"].ContainsKey("windows")) { $conf["bundle"]["windows"] = @{} }
          $conf["bundle"]["windows"]["certificateThumbprint"] = $cert.Thumbprint
          $conf["bundle"]["windows"]["digestAlgorithm"] = "sha256"
          $conf["bundle"]["windows"]["timestampUrl"] = "http://timestamp.digicert.com"
          $conf | ConvertTo-Json -Depth 20 | Set-Content -Path $file -Encoding utf8
          Write-Output "Signing with certificate $($cert.Subject) ($($cert.Thumbprint))"

      # Required: the updater's signing key. Each installer the app can update itself with gets a
      # .sig made with it, and the app installs an update only when that signature matches the
      # public key in tauri.conf.json. The setting is switched on here, not in tauri.conf.json, so
      # builds from source work without the key. See docs/RELEASING.md, "Update signing".
      - name: Update signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No TAURI_SIGNING_PRIVATE_KEY secret: the installed apps could not update themselves to this release. See docs/RELEASING.md, \"Update signing\"."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          '

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # empty for a key made without a password
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          retryAttempts: 1

  publish:
    name: Add extension and checksums, publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARM64_LINUX: ${{ needs.prepare.outputs.arm64_linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"

      # Reproducible: sorted entries, file times set to the commit time, no extra attributes.
      - name: Package the browser extension
        run: |
          zip_path="$RUNNER_TEMP/byterush-extension-$VERSION.zip"
          epoch=$(git log -1 --format=%ct)
          find extension -exec touch -h -d "@$epoch" {} +
          (cd extension && find . -type f ! -name '.*' | LC_ALL=C sort | TZ=UTC zip -X -D -q "$zip_path" -@)
          unzip -l "$zip_path"
          gh release upload "$TAG" "$zip_path" --clobber

      - name: Check the assets, write SHA256SUMS.txt
        run: |
          dir="$RUNNER_TEMP/assets"
          mkdir -p "$dir"
          gh release download "$TAG" --dir "$dir" --clobber
          rm -f "$dir/SHA256SUMS.txt"
          # the landing page (zecod/byterush-frontend) finds the installers by these names (tauri-action's defaults)
          required=(
            "Byterush_${VERSION}_x64-setup.exe"
            "Byterush_${VERSION}_x64_en-US.msi"
            "Byterush_${VERSION}_aarch64.dmg"
            "Byterush_${VERSION}_amd64.AppImage"
            "Byterush_${VERSION}_amd64.deb"
            "Byterush-${VERSION}-1.x86_64.rpm"
            "byterush-extension-${VERSION}.zip"
            # the updater's signatures: byterush.xyz offers an installed app the update only with them
            "Byterush_${VERSION}_x64-setup.exe.sig"
            "Byterush_${VERSION}_x64_en-US.msi.sig"
            "Byterush_${VERSION}_aarch64.app.tar.gz"
            "Byterush_${VERSION}_aarch64.app.tar.gz.sig"
            "Byterush_${VERSION}_amd64.AppImage.sig"
          )
          if [ "$ARM64_LINUX" = true ]; then
            required+=("Byterush_${VERSION}_aarch64.AppImage" "Byterush_${VERSION}_aarch64.AppImage.sig" "Byterush_${VERSION}_arm64.deb" "Byterush-${VERSION}-1.aarch64.rpm")
          fi
          missing=0
          for name in "${required[@]}"; do
            if [ ! -s "$dir/$name" ]; then
              echo "::error::missing or empty release asset: $name"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          (cd "$dir" && sha256sum -- * | LC_ALL=C sort -k 2) > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          {
            echo "### Byterush $VERSION"
            echo
            echo '```'
            cat "$RUNNER_TEMP/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Setting the repository variable RELEASE_DRAFT_ONLY to "true" stops here, so the finished
      # draft can be reviewed and published by hand.
      - name: Publish
        if: vars.RELEASE_DRAFT_ONLY != 'true'
        run: |
          gh release edit "$TAG" --draft=false --latest --title "Byterush $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json url --jq .url

      - name: Left as a draft
        if: vars.RELEASE_DRAFT_ONLY == 'true'
        run: |
          gh release edit "$TAG" --title "Byterush $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "::notice::RELEASE_DRAFT_ONLY is set: $TAG is complete but still a draft. Publish it with: gh release edit $TAG --draft=false --latest"
